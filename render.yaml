services:
  # Web Application Service — Standard Plan (Production-Grade, Paid)
  - type: web
    name: uew-digital-library
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: standard
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "UEW Digital Library"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: "base64:6MsNsV445Nu736a1nFYqt1cNboYaJQJZk/nv7FTp9K4="
      - key: APP_URL
        value: "https://uew-digital-library.onrender.com"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: uew-library-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: uew-library-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: uew-library-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: uew-library-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: uew-library-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtppro.zoho.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_FROM_ADDRESS
        value: test@johnokyere.xyz
      - key: MAIL_FROM_NAME
        value: "UEW School of Business Digital Library"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
    disk:
      name: uew-library-storage
      mountPath: /var/www/html/storage/app/public
      sizeGB: 10

# Managed PostgreSQL Database — basic-1gb Plan (Paid, Production-Grade)
# Render current valid plan identifiers: free, basic-256mb, basic-1gb, standard-4gb, pro-8gb, etc.
# Use the Render Dashboard > New PostgreSQL to confirm available plans for your workspace.
databases:
  - name: uew-library-db
    databaseName: uew_library
    user: uew_admin
    region: frankfurt
    plan: basic-1gb
    diskSizeGB: 10
    postgresMajorVersion: 16
